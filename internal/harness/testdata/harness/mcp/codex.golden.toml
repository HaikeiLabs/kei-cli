model = "gpt-5"
approval_policy = "on-request"

[mcp_servers.my-local]
command = "npx"
args = ["-y", "@me/server"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"

[profiles.fast]
model = "gpt-5-mini"

[mcp_servers.linear]
# managed by kei harness sync
url = "https://mcp.linear.example/mcp"
bearer_token_env_var = "KEI_MCP_LINEAR_TOKEN"

[mcp_servers.notion]
# managed by kei harness sync
url = "https://mcp.notion.example/mcp"
bearer_token_env_var = "KEI_MCP_NOTION_TOKEN"
