# kei-cli release workflow.
#
# Triggered by pushing a semver tag (vX.Y.Z), or manually with a version bump.
# Validates the tag, imports the GPG signing key, builds signed
# binaries and archives via Goreleaser, and uploads them to the S3 releases
# bucket.
#
# Published artifacts (all under s3://BUCKET/kei-cli/):
#   install.sh                  — curl installer (fixed path, overwritten each release)
#   latest.txt                  — latest stable version (stable releases only)
#   <version>/                  — goreleaser artifacts per version
#     kei-cli_<v>_<os>_<arch>.tar.gz
#     kei-cli_<v>_checksums.txt
#     kei-cli_<v>_source.tar.gz
#
# Customer install URL:
#   curl -fsSL "$AWS_S3_RELEASES_URL_BASE/kei-cli/install.sh" | bash
#
# Required GitHub configuration:
#
#   1. The self-hosted release runner Pod must receive an AWS identity via IRSA
#      with PutObject, ListBucket, and HeadBucket access to the releases bucket.
#
#   2. GPG private key for checksum signing:
#      - Stored as a GitHub Actions secret named GORELEASER_SIGNING_KEY.
#      - The corresponding public key should be published to a keyserver
#        or documented in the repo.
#
#   3. Optional GitHub Actions variable (not secret):
#      - AWS_REGION — the region of the releases bucket; defaults to us-east-1.
#      - AWS_S3_RELEASES_BUCKET — the release bucket; defaults to kei-cli-releases.
#
# Security model:
#   - No AWS credentials are stored in the repository or workflow YAML.
#   - AWS access comes from the release Pod's dedicated IRSA role.
#   - The GPG key is imported from a GitHub secret and never logged.
#   - The install script and goreleaser config contain zero credentials.
#
# Prerequisites (applied by PR #11+ Terraform companion):
#   - S3 bucket kei-releases (or similar) with server-side encryption,
#     versioning, and public-read bucket policy for object GETs.
#   - The release runner's IRSA role has s3:PutObject on
#     arn:aws:s3:::kei-releases/kei-cli/*

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment to publish (defaults to patch)
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # These are non-sensitive configuration variables shared across steps.
  # AWS_REGION is optional for the current us-east-1 release bucket.
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_S3_RELEASES_BUCKET: ${{ vars.AWS_S3_RELEASES_BUCKET || 'kei-cli-releases' }}
  # The GPG key ID, used by goreleaser's signing step. Must match the
  # imported key's identity (email or key ID).
  GORELEASER_KEY: kei-cli-releases@haikeilabs.com

jobs:
  authorize_manual_release:
    name: Authorize manual release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require repository or organization owner
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor,
            });

            if (permission.data.permission !== 'admin') {
              core.setFailed(`@${context.actor} must be a repository or organization owner to run a manual release`);
            }

  validate-tag:
    name: Validate tag
    needs: [authorize_manual_release]
    if: always() && (needs.authorize_manual_release.result == 'success' || needs.authorize_manual_release.result == 'skipped')
    runs-on: kei-cli-release
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate tag
        id: parse
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --tags --force origin
            LATEST_TAG="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)"
            if [ -z "$LATEST_TAG" ]; then
              echo "ERROR: no stable semver tag exists to increment"
              exit 1
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "${INPUT_BUMP:-minor}" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) echo "ERROR: bump must be patch, minor, or major"; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Tag: $TAG"

          # Must be a strict semver tag: vMAJOR.MINOR.PATCH with optional
          # pre-release suffix (e.g. v0.1.0, v1.0.0-rc.1).
          if ! echo "$TAG" | grep -qE '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[a-zA-Z0-9._-]+)?$'; then
            echo "ERROR: tag '$TAG' does not match semver pattern vX.Y.Z[-prerelease]"
            exit 1
          fi

          VERSION="${TAG#v}"

          # Determine release channel
          if echo "$TAG" | grep -qE '\-rc\.|-alpha\.|-beta\.'; then
            CHANNEL="prerelease"
          else
            CHANNEL="stable"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/${{ steps.parse.outputs.tag }}" >/dev/null 2>&1; then
            echo "ERROR: tag '${{ steps.parse.outputs.tag }}' already exists"
            exit 1
          fi
          echo "Release tag ${{ steps.parse.outputs.tag }} validated."

  release:
    name: Release
    needs: [validate-tag]
    runs-on: kei-cli-release
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create local tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: git tag "${{ needs.validate-tag.outputs.tag }}" "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.26'
          cache: true

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GORELEASER_SIGNING_KEY }}
          passphrase: ''
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: false

      - name: Verify GPG key is available
        run: |
          gpg --list-keys --keyid-format LONG "$GORELEASER_KEY" || {
            echo "ERROR: GPG key $GORELEASER_KEY not found after import."
            exit 1
          }

      - name: Validate runner AWS identity
        run: |
          aws sts get-caller-identity
          echo "Runner AWS identity validated."

      - name: Validate S3 bucket accessibility
        run: |
          BUCKET="${{ env.AWS_S3_RELEASES_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            echo "ERROR: AWS_S3_RELEASES_BUCKET variable is not set."
            exit 1
          fi
          # List only the release prefix; the runner role intentionally grants
          # ListBucket access with this prefix condition, not to the whole bucket.
          aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "kei-cli/" \
            --max-items 1 \
            --region "${{ env.AWS_REGION }}"

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ env.GORELEASER_KEY }}
          AWS_S3_RELEASES_BUCKET: ${{ env.AWS_S3_RELEASES_BUCKET }}
          AWS_S3_RELEASES_REGION: ${{ env.AWS_REGION }}
          GORELEASER_CURRENT_TAG: ${{ needs.validate-tag.outputs.tag }}

      - name: Upload install.sh to public release endpoint
        run: |
          BUCKET="${{ env.AWS_S3_RELEASES_BUCKET }}"

          # The customer curl flow is:
          #   curl -fsSL "$AWS_S3_RELEASES_URL_BASE/kei-cli/install.sh" | bash
          # This requires install.sh at the fixed, non-versioned path:
          #   s3://BUCKET/kei-cli/install.sh
          #
          # The script is version-independent (it reads the version from
          # latest.txt or the -v flag), so it is overwritten on every release.
          #
          # Upload with cache-control: no-cache so CDN/proxies always serve
          # the latest revision.
          # NOTE: ACL is not set here because the bucket blocks public ACLs.
          # Public read is granted by the bucket policy (see infra/modules/release-bucket).
          aws s3 cp "scripts/install.sh" "s3://${BUCKET}/kei-cli/install.sh" \
            --region "${{ env.AWS_REGION }}" \
            --content-type "text/x-shellscript" \
            --cache-control "no-cache"

          echo "Published install.sh to s3://${BUCKET}/kei-cli/install.sh"

      - name: Verify no credentials leaked in artifacts
        run: |
          # Check that none of the uploaded artifacts contain AWS credentials
          # or sensitive patterns. This runs post-release as a safety net.
          # The install script and goreleaser config are already statically
          # checked by release_test.go, but we also check the generated
          # checksums and metadata files.

          DIST="${RUNNER_TEMP}/goreleaser-dist"
          mkdir -p "$DIST"
          BUCKET="${{ env.AWS_S3_RELEASES_BUCKET }}"
          VERSION="${{ needs.validate-tag.outputs.version }}"
          CHECKSUMS_FILE="kei-cli_${VERSION}_checksums.txt"

          aws s3 cp "s3://${BUCKET}/kei-cli/${VERSION}/${CHECKSUMS_FILE}" "${DIST}/checksums.txt" --region "${{ env.AWS_REGION }}" || {
            echo "Warning: could not download checksums for verification. Skipping artifact leak check."
            exit 0
          }

          # Check for any lines that look like credentials
          if grep -qiE '(AWS[A-Z_]*KEY|AWS_SECRET|BEGIN RSA|BEGIN PGP PRIVATE)' "${DIST}/checksums.txt"; then
            echo "ERROR: Potential credential leak detected in checksums file."
            grep -nE '(AWS[A-Z_]*KEY|AWS_SECRET|BEGIN RSA|BEGIN PGP PRIVATE)' "${DIST}/checksums.txt"
            exit 1
          fi

          # Also verify the uploaded install.sh has no credentials
          aws s3 cp "s3://${BUCKET}/kei-cli/install.sh" "${DIST}/install.sh" --region "${{ env.AWS_REGION }}"
          if grep -qiE '(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|BEGIN RSA|BEGIN PGP PRIVATE)' "${DIST}/install.sh"; then
            echo "ERROR: Potential credential leak detected in uploaded install.sh."
            exit 1
          fi

          echo "Artifact leak check passed."

      - name: Write latest.txt (stable releases only)
        if: needs.validate-tag.outputs.channel == 'stable'
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          BUCKET="${{ env.AWS_S3_RELEASES_BUCKET }}"

          # NOTE: ACL is not set here because the bucket blocks public ACLs.
          # Public read is granted by the bucket policy (see infra/modules/release-bucket).
          echo -n "$VERSION" | aws s3 cp - "s3://${BUCKET}/kei-cli/latest.txt" \
            --region "${{ env.AWS_REGION }}" \
            --content-type "text/plain" \
            --cache-control "no-cache"

          echo "Published latest.txt: $VERSION"
